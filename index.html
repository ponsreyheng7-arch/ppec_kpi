<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phnom Penh Eye Clinic - Performance Dashboard & KPI</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="assets/js/firebase-config.js"></script>
    
    <!-- Custom Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hanuman:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Hanuman', 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9;
            overflow-x: hidden;
        }

        .compact-card {
            min-width: 0;
        }
        
        .table-container::-webkit-scrollbar {
            height: 10px;
            width: 10px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 8px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 8px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .excel-input {
            width: 100%;
            background: transparent;
            border: 1px solid transparent;
            padding: 4px 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .excel-input:hover {
            border-color: #cbd5e1;
        }
        .excel-input:focus {
            outline: none;
            border-color: #3b82f6;
            background: #fff;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }

        .sticky-col-1 { left: 0px; position: sticky; z-index: 10; background: inherit; }
        .sticky-col-2 { left: 40px; position: sticky; z-index: 10; background: inherit; }
        
        @keyframes fillBar {
            from { width: 0; }
        }
        .animate-bar {
            animation: fillBar 1s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            const [kpiList, setKpiList] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [isSaving, setIsSaving] = useState(false);
            const [saveStatus, setSaveStatus] = useState("រក្សាទុក (Save)");

            // Load data from Firestore when the app starts
            useEffect(() => {
                const db = getFirebaseDb();
                if (!db) {
                    setIsLoading(false);
                    return;
                }

                setIsLoading(true);

                const collectionRef = db.collection("ppec_kpi");
                const legacyDocRef = db.collection("ppec_kpi").doc("dashboard");

                Promise.all([
                    collectionRef.get(),
                    legacyDocRef.get()
                ])
                .then(([querySnapshot, legacyDoc]) => {
                    const collectionData = querySnapshot.docs
                        .filter((doc) => doc.id !== "dashboard")
                        .map((doc) => {
                            const data = doc.data() || {};
                            return {
                                ...data,
                                id: Number(doc.id) || data.id || Date.now(),
                                name: data.name || "",
                                department: data.department || "",
                                position: data.position || "",
                                dateCreated: data.dateCreated || "",
                                goal1: data.goal1 || "",
                                goal2: data.goal2 || "",
                                goal3: data.goal3 || "",
                                progress1: Number(data.progress1) || 0,
                                progress2: Number(data.progress2) || 0,
                                progress3: Number(data.progress3) || 0,
                            };
                        })
                        .sort((a, b) => Number(a.id) - Number(b.id));

                    const legacyData = legacyDoc.exists && Array.isArray(legacyDoc.data().data)
                        ? legacyDoc.data().data
                        : [];

                    const mergedData = [...collectionData, ...legacyData].reduce((acc, item) => {
                        if (!item || typeof item !== 'object') return acc;
                        const normalizedId = String(item.id ?? Date.now() + Math.random());
                        acc[normalizedId] = {
                            ...item,
                            id: Number(normalizedId) || normalizedId,
                            name: item.name || "",
                            department: item.department || "",
                            position: item.position || "",
                            dateCreated: item.dateCreated || "",
                            goal1: item.goal1 || "",
                            goal2: item.goal2 || "",
                            goal3: item.goal3 || "",
                            progress1: Number(item.progress1) || 0,
                            progress2: Number(item.progress2) || 0,
                            progress3: Number(item.progress3) || 0,
                        };
                        return acc;
                    }, {});

                    const finalData = Object.values(mergedData).sort((a, b) => Number(a.id) - Number(b.id));

                    if (finalData.length > 0) {
                        setKpiList(finalData);
                        if (legacyData.length > 0 && collectionData.length === 0) {
                            saveToBackend(finalData);
                        }
                    } else {
                        setKpiList([]);
                    }

                    setIsLoading(false);
                })
                .catch((err) => {
                    console.error("Error loading data from Firebase:", err);
                    setKpiList([]);
                    setIsLoading(false);
                });
            }, []);

            // Save data to Firestore as one document per staff
            const saveToBackend = (dataToSave) => {
                const db = getFirebaseDb();
                if (!db) {
                    setIsSaving(false);
                    setSaveStatus("Firebase not configured");
                    return;
                }

                setIsSaving(true);
                setSaveStatus("កំពុងរក្សាទុក...");

                const collectionRef = db.collection("ppec_kpi");
                collectionRef.get()
                    .then((snapshot) => {
                        const desiredIds = new Set(dataToSave.map((item) => String(item.id)));

                        const deletions = snapshot.docs
                            .filter((doc) => doc.id !== "dashboard" && !desiredIds.has(String(doc.id)))
                            .map((doc) => doc.ref.delete());

                        const legacyDelete = db.collection("ppec_kpi").doc("dashboard").delete().catch(() => {});

                        const writes = dataToSave.map((item) => {
                            const cleanItem = { ...item, id: Number(item.id) || item.id };
                            return collectionRef.doc(String(cleanItem.id)).set({
                                ...cleanItem,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        });

                        return Promise.all([...deletions, legacyDelete, ...writes]);
                    })
                    .then(() => {
                        setIsSaving(false);
                        setSaveStatus("បានរក្សាទុក! (Saved!)");
                        setTimeout(() => setSaveStatus("រក្សាទុក (Save)"), 2000);
                    })
                    .catch((err) => {
                        setIsSaving(false);
                        setSaveStatus("រក្សាទុក (Save)");
                        alert("បរាជ័យក្នុងការរក្សាទុកទៅ Firebase: " + err.message);
                    });
            };

            const parseCSVText = (text) => {
                const rows = [];
                let currentRow = [];
                let currentCell = '';
                let inQuotes = false;
                
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    if (char === '"' && text[i+1] === '"') {
                        currentCell += '"';
                        i++;
                    } else if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        currentRow.push(currentCell);
                        currentCell = '';
                    } else if ((char === '\n' || char === '\r') && !inQuotes) {
                        if (char === '\r' && text[i+1] === '\n') i++;
                        currentRow.push(currentCell);
                        rows.push(currentRow);
                        currentRow = [];
                        currentCell = '';
                    } else {
                        currentCell += char;
                    }
                }
                if (currentRow.length > 0 || currentCell !== '') {
                    currentRow.push(currentCell);
                    rows.push(currentRow);
                }

                if (rows.length > 0) rows.shift();
                
                return rows.filter(row => row.length > 5).map((row, idx) => {
                    const rawId = row[0] || "";
                    const parsedId = Number(String(rawId).trim());

                    return {
                        id: Number.isFinite(parsedId) && parsedId > 0 ? parsedId : Date.now() + idx,
                        name: row[1] || "",
                        department: row[2] || "",
                        position: row[3] || "",
                        dateCreated: row[4] || "",
                        goal1: row[5] || "", start1: row[6] || "", finish1: row[7] || "", progress1: Number(row[8] || 0),
                        goal2: row[9] || "", start2: row[10] || "", finish2: row[11] || "", progress2: Number(row[12] || 0),
                        goal3: row[13] || "", start3: row[14] || "", finish3: row[15] || "", progress3: Number(row[16] || 0),
                    };
                });
            };

            const [viewMode, setViewMode] = useState("dashboard");
            const [searchQuery, setSearchQuery] = useState("");
            const [selectedDept, setSelectedDept] = useState("All");
            const [selectedGrade, setSelectedGrade] = useState("All");

            const [currentTime, setCurrentTime] = useState(new Date());

            const [deleteTargetId, setDeleteTargetId] = useState(null);
            const [deletePassword, setDeletePassword] = useState("");
            const [deleteError, setDeleteError] = useState("");

            const [showImportAuth, setShowImportAuth] = useState(false);
            const [importPassword, setImportPassword] = useState("");
            const [importError, setImportError] = useState("");

            const [selectedStaffInfo, setSelectedStaffInfo] = useState(null);
            const [focusStaffId, setFocusStaffId] = useState(null);

            const calculateTotalCompletion = (item) => {
                const p1 = Number(item.progress1) || 0;
                const p2 = Number(item.progress2) || 0;
                const p3 = Number(item.progress3) || 0;
                return Math.round((p1 + p2 + p3) / 3);
            };

            const getPerformanceGrade = (completion) => {
                if (completion >= 95) {
                    return { grade: "Exceeds Expectations", kh: "ល្អប្រសើរណាស់", bg: "bg-emerald-100", color: "text-emerald-800", border: "border-emerald-300" };
                }
                if (completion >= 75) {
                    return { grade: "Meets Expectations", kh: "តាមផែនការ", bg: "bg-blue-100", color: "text-blue-800", border: "border-blue-300" };
                }
                return { grade: "Needs Improvement", kh: "ត្រូវការស្ថាបនា", bg: "bg-rose-100", color: "text-rose-800", border: "border-rose-300" };
            };

            const getProgressColor = (progress) => {
                const p = Number(progress) || 0;
                if (p >= 110) return { border: 'border-teal-100', side: 'bg-teal-500', textHeader: 'text-teal-500', textPercent: 'text-teal-700', bgPercent: 'bg-teal-50', bar: 'bg-teal-500' };
                if (p >= 90) return { border: 'border-emerald-100', side: 'bg-emerald-500', textHeader: 'text-emerald-500', textPercent: 'text-emerald-700', bgPercent: 'bg-emerald-50', bar: 'bg-emerald-500' };
                if (p >= 60) return { border: 'border-amber-100', side: 'bg-amber-500', textHeader: 'text-amber-500', textPercent: 'text-amber-700', bgPercent: 'bg-amber-50', bar: 'bg-amber-500' };
                if (p >= 30) return { border: 'border-orange-100', side: 'bg-orange-500', textHeader: 'text-orange-500', textPercent: 'text-orange-700', bgPercent: 'bg-orange-50', bar: 'bg-orange-500' };
                return { border: 'border-rose-100', side: 'bg-rose-500', textHeader: 'text-rose-500', textPercent: 'text-rose-700', bgPercent: 'bg-rose-50', bar: 'bg-rose-500' };
            };

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                if (viewMode === 'sheet' && focusStaffId !== null) {
                    setTimeout(() => {
                        const inputElement = document.getElementById(`staff-name-input-${focusStaffId}`);
                        const rowElement = document.getElementById(`staff-row-${focusStaffId}`);
                        if (inputElement) {
                            inputElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            inputElement.focus();
                            if (rowElement) {
                                rowElement.classList.add('bg-blue-100');
                                setTimeout(() => rowElement.classList.remove('bg-blue-100'), 2000);
                            }
                        }
                        setFocusStaffId(null);
                    }, 100);
                }
            }, [viewMode, focusStaffId]);

            const handleCellChange = (id, field, value) => {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const today = `${year}-${month}-${day}`;

                const updatedList = kpiList.map(item => {
                    if (item.id === id) {
                        return { 
                            ...item, 
                            [field]: value,
                            dateCreated: field === 'dateCreated' ? value : today
                        };
                    }
                    return item;
                });

                setKpiList(updatedList);
            };

            const handleManualSave = () => {
                saveToBackend(kpiList);
            };

            const handleAddStaff = () => {
                const newId = kpiList.length > 0 ? Math.max(...kpiList.map(item => item.id)) + 1 : 1;
                const newStaff = {
                    id: newId,
                    name: "",
                    department: "10 DOCTO ក្រុមវេជ្ជបណ្ឌិត (Doctor Team)",
                    position: "",
                    dateCreated: new Date().toISOString().split('T')[0],
                    goal1: "", start1: "", finish1: "", status1: "", progress1: 0,
                    goal2: "", start2: "", finish2: "", status2: "", progress2: 0,
                    goal3: "", start3: "", finish3: "", status3: "", progress3: 0,
                };
                const updatedList = [newStaff, ...kpiList];
                setKpiList(updatedList);
                setViewMode("sheet");
                saveToBackend(updatedList);
            };

            const handleGoToEdit = (id) => {
                setSearchQuery("");
                setSelectedDept("All");
                setSelectedGrade("All");
                setViewMode('sheet');
                setFocusStaffId(id);
                setSelectedStaffInfo(null);
            };

            const promptDeleteStaff = (id) => {
                setDeleteTargetId(id);
                setDeletePassword("");
                setDeleteError("");
            };

            const confirmDelete = () => {
                if (deletePassword === "123123") {
                    const updatedList = kpiList.filter(item => item.id !== deleteTargetId);
                    setKpiList(updatedList);
                    setDeleteTargetId(null);
                    saveToBackend(updatedList);
                } else {
                    setDeleteError("លេខសម្ងាត់មិនត្រឹមត្រូវ! (Incorrect password!)");
                }
            };

            const cancelDelete = () => {
                setDeleteTargetId(null);
                setDeletePassword("");
                setDeleteError("");
            };

            const promptImport = () => {
                setShowImportAuth(true);
                setImportPassword("");
                setImportError("");
            };

            const confirmImportAuth = () => {
                if (importPassword === "123123") {
                    setShowImportAuth(false);
                    document.getElementById('csv-import-input').click();
                } else {
                    setImportError("លេខសម្ងាត់មិនត្រឹមត្រូវ! (Incorrect password!)");
                }
            };

            const cancelImportAuth = () => {
                setShowImportAuth(false);
                setImportPassword("");
                setImportError("");
            };

            const filteredData = useMemo(() => {
                return kpiList.filter(item => {
                    if (!item || typeof item !== 'object') return false;

                    const itemName = String(item.name || '').toLowerCase();
                    const itemPosition = String(item.position || '').toLowerCase();
                    const itemDepartment = String(item.department || '');
                    const query = String(searchQuery || '').toLowerCase();

                    const matchesDept = selectedDept === "All" || itemDepartment.includes(selectedDept);
                    const matchesSearch = itemName.includes(query) || itemPosition.includes(query);

                    const overallComp = calculateTotalCompletion(item);
                    const grade = getPerformanceGrade(overallComp).grade;
                    const matchesGrade = selectedGrade === "All" || grade === selectedGrade;

                    return matchesDept && matchesSearch && matchesGrade;
                });
            }, [kpiList, selectedDept, searchQuery, selectedGrade]);

            const dashboardStats = useMemo(() => {
                if (filteredData.length === 0) return null;
                
                let sumCompletion = 0;
                let exceeds = 0;
                let meets = 0;
                let below = 0;
                
                const deptScores = {};

                filteredData.forEach(item => {
                    const comp = calculateTotalCompletion(item);
                    sumCompletion += comp;

                    if (comp >= 95) exceeds++;
                    else if (comp >= 75) meets++;
                    else below++;

                    const deptKey = String(item.department || 'Unknown');
                    if (!deptScores[deptKey]) deptScores[deptKey] = { total: 0, count: 0 };
                    deptScores[deptKey].total += comp;
                    deptScores[deptKey].count += 1;
                });

                const avgOverall = Math.round(sumCompletion / filteredData.length);
                
                const deptAverages = Object.keys(deptScores).map(dept => ({
                    dept,
                    avg: Math.round(deptScores[dept].total / deptScores[dept].count)
                })).sort((a, b) => b.avg - a.avg);

                return { avgOverall, exceeds, meets, below, totalStaff: filteredData.length, deptAverages };
            }, [filteredData]);

            const handleExportCSV = () => {
                const headers = [
                    "ID", "Name", "Department", "Position", "Date Created",
                    "Goal 1", "Start 1", "Finish 1", "Progress 1 (%)",
                    "Goal 2", "Start 2", "Finish 2", "Progress 2 (%)",
                    "Goal 3", "Start 3", "Finish 3", "Progress 3 (%)",
                    "Overall Completion (%)", "Performance Grade"
                ];
                
                const csvRows = [headers.join(",")];
                
                kpiList.forEach(item => {
                    const overallComp = calculateTotalCompletion(item);
                    const gradeInfo = getPerformanceGrade(overallComp);
                    
                    const row = [
                        item.id,
                        `"${(item.name || '').replace(/"/g, '""')}"`,
                        `"${(item.department || '').replace(/"/g, '""')}"`,
                        `"${(item.position || '').replace(/"/g, '""')}"`,
                        item.dateCreated,
                        `"${(item.goal1 || '').replace(/"/g, '""')}"`, item.start1, item.finish1, item.progress1,
                        `"${(item.goal2 || '').replace(/"/g, '""')}"`, item.start2, item.finish2, item.progress2,
                        `"${(item.goal3 || '').replace(/"/g, '""')}"`, item.start3, item.finish3, item.progress3,
                        overallComp,
                        `"${gradeInfo.grade}"`
                    ];
                    csvRows.push(row.join(","));
                });
                
                const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + csvRows.join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `PPEC_Staff_KPI_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const normalizeStaffKey = (item) => {
                return [
                    String(item?.name || '').trim().toLowerCase(),
                    String(item?.department || '').trim().toLowerCase(),
                    String(item?.position || '').trim().toLowerCase()
                ].join('|');
            };

            const mergeImportedData = (existingList, importedList) => {
                const merged = [...existingList];
                const map = new Map(existingList.map(item => [normalizeStaffKey(item), item]));

                importedList.forEach((item) => {
                    const key = normalizeStaffKey(item);
                    const existingIndex = merged.findIndex(existing => normalizeStaffKey(existing) === key);

                    if (existingIndex >= 0) {
                        merged[existingIndex] = {
                            ...merged[existingIndex],
                            ...item,
                            id: merged[existingIndex].id
                        };
                    } else {
                        merged.push({
                            ...item,
                            id: Number(item.id) || Date.now() + Math.random()
                        });
                    }

                    map.set(key, item);
                });

                return merged;
            };

            const handleImportCSV = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const newData = parseCSVText(text);

                    if (newData.length > 0) {
                        const mergedData = mergeImportedData(kpiList, newData);
                        setKpiList(mergedData);
                        saveToBackend(mergedData);
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const renderDashboard = () => {
                if (!dashboardStats) return <div className="p-8 text-center text-slate-500">គ្មានទិន្នន័យ (No Data)</div>;

                const exceedsStaff = filteredData.filter(item => calculateTotalCompletion(item) >= 95);
                const meetsStaff = filteredData.filter(item => { 
                    const comp = calculateTotalCompletion(item); 
                    return comp >= 75 && comp < 95; 
                });
                const belowStaff = filteredData.filter(item => calculateTotalCompletion(item) < 75);

                const recentUpdates = [...filteredData].sort((a, b) => new Date(b.dateCreated) - new Date(a.dateCreated)).slice(0, 6);
                const oldestUpdates = [...filteredData].sort((a, b) => new Date(a.dateCreated) - new Date(b.dateCreated)).slice(0, 6);

                return (
                    <div className="space-y-6 animate-fade-in">
                        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
                            <div className="compact-card bg-white p-5 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-indigo-500">
                                <p className="text-sm text-slate-500 mb-1 font-semibold">ភាគរយសម្រេចសរុប (Overall Completion)</p>
                                <div className="flex items-end gap-2">
                                    <h3 className="text-4xl font-bold text-slate-800">{dashboardStats.avgOverall}%</h3>
                                </div>
                            </div>
                            <div className="compact-card bg-white p-5 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-emerald-500">
                                <p className="text-sm text-slate-500 mb-1 font-semibold">Exceeds Expectations</p>
                                <div className="flex items-end gap-2">
                                    <h3 className="text-4xl font-bold text-emerald-600">{dashboardStats.exceeds}</h3>
                                    <span className="text-sm text-slate-400 mb-1">នាក់ (Staff)</span>
                                </div>
                            </div>
                            <div className="compact-card bg-white p-5 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-blue-500">
                                <p className="text-sm text-slate-500 mb-1 font-semibold">Meets Expectations</p>
                                <div className="flex items-end gap-2">
                                    <h3 className="text-4xl font-bold text-blue-600">{dashboardStats.meets}</h3>
                                    <span className="text-sm text-slate-400 mb-1">នាក់ (Staff)</span>
                                </div>
                            </div>
                            <div className="compact-card bg-white p-5 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-rose-500">
                                <p className="text-sm text-slate-500 mb-1 font-semibold">Needs Improvement</p>
                                <div className="flex items-end gap-2">
                                    <h3 className="text-4xl font-bold text-rose-600">{dashboardStats.below}</h3>
                                    <span className="text-sm text-slate-400 mb-1">នាក់ (Staff)</span>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
                                <h3 className="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">

                                                    <p className="text-slate-800 font-semibold text-[15px] mt-1">{selectedStaffInfo.goal2 || <span className="text-slate-400 italic font-normal">មិនមានទិន្នន័យ (No Data)</span>}</p>
                                                </div>
                                                <span className={`${c2.textPercent} font-black text-xl ${c2.bgPercent} px-3 py-1 rounded-lg`}>{selectedStaffInfo.progress2}%</span>
                                            </div>
                                            <div className="w-full bg-slate-100 rounded-full h-2 mt-4 ml-3 w-[calc(100%-12px)]">
                                                <div className={`${c2.bar} h-2 rounded-full transition-all duration-1000 ease-out`} style={{ width: `${Math.max(0, Number(selectedStaffInfo.progress2) || 0)}%` }}></div>
                                            </div>
                                        </div>

                                        <div className={`bg-white p-5 rounded-xl border ${c3.border} shadow-sm relative overflow-hidden`}>
                                            <div className={`absolute left-0 top-0 bottom-0 w-1 ${c3.side}`}></div>
                                            <div className="flex justify-between items-start mb-2 pl-3">
                                                <div>
                                                    <span className={`text-xs font-bold ${c3.textHeader} uppercase tracking-wider`}>គោលដៅទី៣ (Goal 3)</span>
                                                    <p className="text-slate-800 font-semibold text-[15px] mt-1">{selectedStaffInfo.goal3 || <span className="text-slate-400 italic font-normal">មិនមានទិន្នន័យ (No Data)</span>}</p>
                                                </div>
                                                <span className={`${c3.textPercent} font-black text-xl ${c3.bgPercent} px-3 py-1 rounded-lg`}>{selectedStaffInfo.progress3}%</span>
                                            </div>
                                            <div className="w-full bg-slate-100 rounded-full h-2 mt-4 ml-3 w-[calc(100%-12px)]">
                                                <div className={`${c3.bar} h-2 rounded-full transition-all duration-1000 ease-out`} style={{ width: `${Math.max(0, Number(selectedStaffInfo.progress3) || 0)}%` }}></div>
                                            </div>
                                        </div>

                                    </div>

                                    <div className={`p-5 border-t border-slate-200 flex justify-between items-center ${getPerformanceGrade(calculateTotalCompletion(selectedStaffInfo)).bg}`}>
                                        <div>
                                            <span className="text-slate-600 font-semibold text-xs uppercase tracking-wider block mb-1">ចំណាត់ថ្នាក់សមត្ថភាព (Performance Grade)</span>
                                            <span className={`font-black text-lg ${getPerformanceGrade(calculateTotalCompletion(selectedStaffInfo)).color}`}>
                                                {getPerformanceGrade(calculateTotalCompletion(selectedStaffInfo)).kh} ({getPerformanceGrade(calculateTotalCompletion(selectedStaffInfo)).grade})
                                            </span>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-slate-600 font-semibold text-xs uppercase tracking-wider block mb-1">ភាគរយសរុប</span>
                                            <span className="text-3xl font-black text-slate-800">{calculateTotalCompletion(selectedStaffInfo)}%</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
